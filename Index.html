<!DOCTYPE html>

<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>M Sinclair Enterprises</title>

  <style>

    * { box-sizing: border-box; }

    body {

      margin: 0;

      background: #080e19;

      color: #f1f5f9;

      font-family: Arial, sans-serif;

      text-align: center;

    }

    header {

      padding: 24px;

      border-bottom: 1px solid #34465d;

    }

    .brand {

      font-size: 22px;

      font-weight: bold;

      letter-spacing: 3px;

    }

    .brand span { color: #77b9ed; }

    main {

      padding: 110px 20px;

      min-height: 65vh;

    }

    .emblem {

      color: #aab8c9;

      font-size: 70px;

      font-weight: bold;

      letter-spacing: -7px;

    }

    h1 {

      font-size: clamp(32px, 6vw, 60px);

      margin: 25px 0;

    }

    p {

      max-width: 650px;

      margin: 20px auto;

      line-height: 1.8;

      color: #b8c8d8;

    }

    .accent { color: #77b9ed; }

    footer {

      padding: 30px;

      border-top: 1px solid #34465d;

      color: #aab8c9;

      font-size: 13px;

    }

  </style>

</head>

<body>

  <header>

    <div class="brand">M SINCLAIR <span>ENTERPRISES</span></div>

  </header>

  <main>

    <div class="emblem">MSE</div>

    <h1>Building What's <span class="accent">Next.</span></h1>

    <p>

      M Sinclair Enterprises is a diversified business

      enterprise focused on business development,

      management, investments, and future ventures.

    </p>

    <p>Our next chapter is taking shape.</p>

  </main>

  <footer>

    &copy; 2026 M Sinclair Enterprises.

    All Rights Reserved.

  </footer>

</body>

</html>
